[alembic]
script_location = migrations
# prepend_sys_path ensures `import app` works when running `alembic` from repo root.
prepend_sys_path = .
# Avoid Alembic's legacy path splitting warning (python >= 3.12).
path_separator = os
# Overridden at runtime by migrations/env.py (settings / -x db_url).
sqlalchemy.url = sqlite+aiosqlite:///data/bot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S